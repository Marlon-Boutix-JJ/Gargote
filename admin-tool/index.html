<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GargotePOS - Générateur de Licence Administrateur (6 Chiffres)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0b0d14;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #161b26;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .desc {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }
    .group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #9ca3af;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 1rem;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #f59e0b;
      font-family: 'Space Grotesk', monospace;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      text-align: center;
      outline: none;
    }
    input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }
    button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f1117;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    .result-box {
      margin-top: 1.5rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      padding: 1.25rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .result-title {
      font-size: 0.8rem;
      color: #10b981;
      font-weight: 700;
    }
    .result-key {
      font-family: 'Space Grotesk', monospace;
      font-size: 2.6rem;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 8px;
      margin: 0.4rem 0;
    }
    .copy-btn {
      background: rgba(16, 185, 129, 0.25);
      color: #10b981;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      padding: 0.6rem;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
  </style>
  <!-- Inclusion de CryptoJS pour un calcul HMAC 100% compatible file:// sans dépendance serveur -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="badge">Espace Administrateur Autonome</div>
    <div class="title">🔑 Générateur à 6 Chiffres</div>
    <div class="desc">Entrez le code défi à 6 chiffres envoyé par le client pour calculer son code d'activation.</div>

    <div class="group">
      <label>CODE DÉFI À 6 CHIFFRES DU CLIENT :</label>
      <input 
        type="text" 
        id="challengeInput" 
        maxlength="6" 
        placeholder="000000" 
        autocomplete="off" 
        oninput="this.value = this.value.replace(/\D/g, '')" 
      />
    </div>

    <button type="button" onclick="generateKey()">GÉNÉRER LE CODE À 6 CHIFFRES</button>

    <div id="resultBox" class="result-box">
      <div class="result-title">CLÉ D'ACTIVATION À 6 CHIFFRES POUR LE CLIENT :</div>
      <div id="resultKey" class="result-key">000000</div>
      <button type="button" class="copy-btn" onclick="copyKey()">Copier le code à 6 chiffres</button>
    </div>
  </div>

  <script>
    const MASTER_SECRET = 'GARGOTE_POS_SECURE_MASTER_KEY_2026_6DIGIT';

    function generateDeterministic6DigitKey(challengeCode) {
      if (!challengeCode) return '000000';
      const clean = String(challengeCode).trim().replace(/\D/g, '').padStart(6, '0');
      const secret = MASTER_SECRET + '_ACTIVATION_SALT_6DIGIT';
      const combined = secret + '_' + clean;
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < combined.length; i++) {
        const ch = combined.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      const num = Math.abs(h1 ^ h2);
      const codeInt = num % 1000000;
      return String(codeInt).padStart(6, '0');
    }

    function generateKey() {
      const input = document.getElementById('challengeInput').value.trim().replace(/\D/g, '');
      if (!input || input.length !== 6) {
        alert('Veuillez saisir les 6 chiffres du Code Défi client !');
        return;
      }

      const key = generateDeterministic6DigitKey(input);

      document.getElementById('resultKey').innerText = key;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyKey() {
      const key = document.getElementById('resultKey').innerText;
      navigator.clipboard.writeText(key).then(() => {
        alert('Code à 6 chiffres (' + key + ') copié ! Transmettez-le au client.');
      }).catch(() => {
        alert('Code à 6 chiffres : ' + key);
      });
    }
  </script>
</body>
</html>
