<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GargotePOS - Admin Generator (6 Chiffres)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0b0d14;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #161b26;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 0.5rem;
    }
    .desc {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }
    .group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #9ca3af;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 1rem;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #f59e0b;
      font-family: 'Space Grotesk', monospace;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 6px;
      text-align: center;
      outline: none;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #f59e0b;
    }
    button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f1117;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover {
      opacity: 0.95;
    }
    .result-box {
      margin-top: 1.5rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 12px;
      padding: 1.25rem;
      display: none;
    }
    .result-title {
      font-size: 0.8rem;
      color: #10b981;
      font-weight: 700;
    }
    .result-key {
      font-family: 'Space Grotesk', monospace;
      font-size: 2.5rem;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 6px;
      margin-top: 0.3rem;
    }
    .copy-btn {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      padding: 0.6rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">🔑 Générateur à 6 Chiffres</div>
    <div class="desc">Entrez le code défi à 6 chiffres envoyé par le client pour obtenir sa clé d'activation.</div>

    <div class="group">
      <label>CODE DÉFI À 6 CHIFFRES DU CLIENT :</label>
      <input type="text" id="challengeInput" maxlength="6" placeholder="000000" autocomplete="off" oninput="this.value = this.value.replace(/\D/g, '')" />
    </div>

    <button onclick="generateKey()">GÉNÉRER LE CODE À 6 CHIFFRES</button>

    <div id="resultBox" class="result-box">
      <div class="result-title">CLÉ À 6 CHIFFRES À RENVOYER AU CLIENT :</div>
      <div id="resultKey" class="result-key"></div>
      <button class="copy-btn" onclick="copyKey()">Copier les 6 chiffres</button>
    </div>
  </div>

  <script>
    const MASTER_SECRET = 'GARGOTE_POS_SECURE_MASTER_KEY_2026_6DIGIT';

    async function generateKey() {
      const input = document.getElementById('challengeInput').value.trim().replace(/\D/g, '').padStart(6, '0');
      if (!input || input.length !== 6) {
        alert('Veuillez saisir un code à 6 chiffres valide !');
        return;
      }

      const encoder = new TextEncoder();
      const keyData = encoder.encode(MASTER_SECRET + '_ACTIVATION_SALT_6DIGIT');
      const messageData = encoder.encode(input);

      const cryptoKey = await window.crypto.subtle.importKey(
        'raw',
        keyData,
        { name: 'HMAC', hash: 'SHA-256' },
        false,
        ['sign']
      );

      const signature = await window.crypto.subtle.sign('HMAC', cryptoKey, messageData);
      const hashArray = Array.from(new Uint8Array(signature));
      const hexStr = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();

      const num = parseInt(hexStr.slice(0, 8), 16);
      const codeInt = Math.abs(num) % 1000000;
      const key = String(codeInt).padStart(6, '0');

      document.getElementById('resultKey').innerText = key;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyKey() {
      const key = document.getElementById('resultKey').innerText;
      navigator.clipboard.writeText(key);
      alert('Code à 6 chiffres copié ! Transmettez-le au client.');
    }
  </script>
</body>
</html>
